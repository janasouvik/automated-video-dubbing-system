version: "3.9"

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:041319@db:5432/video_dubbing
      - APP_ENV=production
      - DEBUG=false
      - WHISPER_MODEL_SIZE=small
    volumes:
      - ../../data:/app/data
      - ../../models_cache:/app/models_cache
      - ../../logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: video_dubbing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "041319"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
